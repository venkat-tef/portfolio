<section class="projects-section page-section">
  <div class="container">
    <div class="section-heading reveal">
      <span class="eyebrow"><i class="fa-solid fa-diagram-project"></i>&nbsp;Selected Work</span>
      <h2>Projects</h2>
      <p>A look at the applications and interfaces I've helped build in production.</p>
    </div>

    <div class="project-cards">
      <article
        *ngFor="let project of projects; let i = index"
        class="project-card reveal"
        [style.animation-delay.ms]="i * 90">
        <div class="project-logo-wrap">
          <img [src]="project.logo" alt="{{ project.name }} logo" class="project-logo">
        </div>
        <div class="project-body">
          <h3>{{ project.name }}</h3>
          <div class="project-meta">
            <span class="chip"><i class="fa-solid fa-user-tie"></i>{{ project.role }}</span>
            <span class="chip"><i class="fa-solid fa-building"></i>{{ project.organization }}</span>
          </div>
          <button (click)="openDescription(project.description)" class="btn btn-secondary project-btn">
            View Description <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </button>
        </div>
      </article>
    </div>
  </div>

  <!-- Popup modal for the description -->
  <div class="modal" *ngIf="showDescription" (click)="closeDescription()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close" (click)="closeDescription()" aria-label="Close">&times;</button>
      <div class="modal-header">Project Description</div>
      <div class="modal-body" [innerHTML]="currentDescription"></div>
    </div>
  </div>
</section>
